<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Loan Servicing Portfolio</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bd:#1F3A6E;--bm:#2D5FA6;--g10:#F4F6F8;--g30:#D0D8E0;--g60:#6B7C93;--g90:#1E2A38;--red:#990000;--redbg:#FDECEA}
body{font-family:Arial,Helvetica,sans-serif;font-size:12px;background:var(--g10);color:var(--g90);min-height:100vh;display:flex;flex-direction:column}
.amh-company-banner{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(90deg,#0A1A40 0%,#1A3070 50%,#0A1A40 100%);color:#FFF;padding:7px 20px;border-bottom:3px solid #8899CC}
.amh-company-name{font-size:18px;font-weight:900;letter-spacing:.06em}
.amh-company-tagline{font-size:11px;color:#99AACC;letter-spacing:.04em}
.login-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}
form{background:#FFF;border:1px solid var(--g30);box-shadow:0 1px 3px rgba(0,0,0,.08);padding:28px 32px;width:320px}
h1{font-size:16px;color:var(--bd);margin-bottom:18px}
label{display:block;font-size:11px;font-weight:bold;color:var(--g60);margin-bottom:4px;margin-top:14px}
input{width:100%;height:30px;border:1px solid var(--g30);padding:0 8px;font-size:12px;outline:none}
input:focus{border-color:var(--bm)}
button{width:100%;margin-top:20px;background:var(--bd);color:#FFF;border:1px solid var(--bm);padding:9px 16px;font-size:12px;font-weight:bold;cursor:pointer}
button:hover{background:var(--bm)}
.error{margin-top:14px;background:var(--redbg);color:var(--red);border:1px solid var(--red);padding:8px 10px;font-size:11px}
</style>
</head>
<body>

<div class="amh-company-banner">
  <span class="amh-company-name">Asset Management Holdings II, LLC</span>
  <span class="amh-company-tagline">Loan Servicing &nbsp;·&nbsp; Private Mortgage Management &nbsp;·&nbsp; Portfolio Lending</span>
</div>

<div class="login-wrap">
  <form id="login-form">
    <h1>Sign in to Loan Servicing Portfolio</h1>
    <label for="email">Email</label>
    <input type="email" id="email" autocomplete="username" autofocus required>
    <label for="password">Password</label>
    <input type="password" id="password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
    <div class="error" id="error" hidden></div>
  </form>
</div>

<script>
document.getElementById('login-form').addEventListener('submit', function (e) {
  e.preventDefault();
  var email = document.getElementById('email').value.trim();
  var password = document.getElementById('password').value;
  var errorEl = document.getElementById('error');
  errorEl.hidden = true;

  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: email, password: password }),
  })
    .then(function (res) {
      if (!res.ok) return res.json().then(function (body) { throw new Error(body.error || 'Sign in failed'); });
      return res.json();
    })
    .then(function () {
      var params = new URLSearchParams(window.location.search);
      var next = params.get('next');
      window.location.href = (next && next.startsWith('/')) ? next : '/index.html';
    })
    .catch(function (err) {
      errorEl.textContent = err.message;
      errorEl.hidden = false;
    });
});
</script>
</body>
</html>
